          - list [ref=f6e462]:
            - listitem [ref=f6e463]: The three machines in Chapter IV are modelled from the drawings, not scanned from surviving reconstructions. Members are simplified and dimensions are proportional rather than measured.
            - listitem [ref=f6e464]: The refectory in Chapter V reconstructs the painted architecture of the Last Supper, not the real room in Santa Maria delle Grazie. The figures are the painting itself, mapped onto the rear wall.
