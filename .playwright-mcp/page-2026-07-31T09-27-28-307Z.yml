      - generic [ref=f6e79]:
        - generic [ref=f6e80]: Capitolo I
        - heading "Il Metodo" [level=2] [ref=f6e81]
        - paragraph [ref=f6e82]: The method — and the rules of this page
        - paragraph [ref=f6e83]: Leonardo never wrote the treatise he kept promising. What survives is a method, scattered across the notebooks and recoverable from them. Below, each of his principles is stated, and then stated again as the rule it imposed on the document you are reading. This chapter is the specification for its own presentation.
      - list [ref=f6e84]:
        - listitem [ref=f6e85]:
          - generic [ref=f6e86]: i
          - generic [ref=f6e87]:
            - heading "Saper vedere" [level=3] [ref=f6e88]
            - paragraph [ref=f6e89]: Knowing how to see
            - paragraph [ref=f6e90]: "Leonardo’s own phrase for the discipline he thought underlay every art and every science: not looking, but knowing how to look."
          - generic [ref=f6e91]:
            - generic [ref=f6e92]: Therefore, on this page
            - paragraph [ref=f6e93]: Nothing on this page explains itself before you have looked at it. Captions arrive after the image, and the annotations on the paintings stay closed until you open them. The reward for patience is the only reward offered.
        - listitem [ref=f6e94]:
          - generic [ref=f6e95]: ii
          - generic [ref=f6e96]:
            - heading "Sfumato" [level=3] [ref=f6e97]
            - paragraph [ref=f6e98]: Smoke
            - paragraph [ref=f6e99]: He instructed painters to let light and shade run together “senza linee o segni, a guisa di fumo” — without lines or borders, in the manner of smoke.
          - generic [ref=f6e100]:
            - generic [ref=f6e101]: Therefore, on this page
            - paragraph [ref=f6e102]: There are almost no borders in this document. Chapters dissolve into the chapters beneath them; panels are separated by gradients and shadow rather than by rules; the one hairline used anywhere fades out before it reaches its own ends.
        - listitem [ref=f6e103]:
          - generic [ref=f6e104]: iii
          - generic [ref=f6e105]:
            - heading "Proporzione" [level=3] [ref=f6e106]
            - paragraph [ref=f6e107]: Proportion
            - paragraph [ref=f6e108]:
              - text: He drew the illustrations for Luca Pacioli’s
              - emphasis [ref=f6e109]: De divina proportione
              - text: in Milan, and spent years measuring the human body against itself.
          - generic [ref=f6e110]:
            - generic [ref=f6e111]: Therefore, on this page
            - paragraph [ref=f6e112]: Every measurement here descends from φ = 1.618. The two columns of the page stand in golden section; the type scale climbs in powers of φ; the spacing steps are Fibonacci numbers — 5, 8, 13, 21, 34, 55, 89. No value in the stylesheet was chosen because it looked about right.
        - listitem [ref=f6e113]:
          - generic [ref=f6e114]: iv
          - generic [ref=f6e115]:
            - heading "Chiaroscuro" [level=3] [ref=f6e116]
            - paragraph [ref=f6e117]: Light and shade
            - paragraph [ref=f6e118]: He held that an object is known by the way light dies across it, and that the painter who outlines a form has already failed to observe it.
          - generic [ref=f6e119]:
            - generic [ref=f6e120]: Therefore, on this page
            - paragraph [ref=f6e121]: Depth is modelled with warm shadow, never with an outline or a hard drop shadow. Raised surfaces catch a thin highlight along their upper edge, the way gesso does. Nothing is pure black and nothing is pure white, because he insisted that neither occurs in nature.
        - listitem [ref=f6e122]:
          - generic [ref=f6e123]: v
          - generic [ref=f6e124]:
            - heading "Notomia" [level=3] [ref=f6e125]
            - paragraph [ref=f6e126]: Anatomy
            - paragraph [ref=f6e127]: He dissected perhaps thirty bodies to learn what governed the surface, and drew the same shoulder from four sides so the structure beneath could not hide.
          - generic [ref=f6e128]:
            - generic [ref=f6e129]: Therefore, on this page
            - paragraph [ref=f6e130]: Every image here can be stripped to its construction. The paintings carry an overlay that exposes their geometry; the machines can be reduced to the blueprint they were drawn from. The finished surface is never the only thing on offer.
        - listitem [ref=f6e131]:
          - generic [ref=f6e132]: vi
          - generic [ref=f6e133]:
            - heading "Moto" [level=3] [ref=f6e134]
            - paragraph [ref=f6e135]: Motion
            - paragraph [ref=f6e136]: “Il moto è causa d’ogni vita” — motion is the cause of all life. He studied it in water, in birds, in the tendons of the hand.
          - generic [ref=f6e137]:
            - generic [ref=f6e138]: Therefore, on this page
            - paragraph [ref=f6e139]: Nothing appears or disappears instantly. Every transition carries momentum into and out of itself on a single easing curve, and the machines keep turning whether or not you are watching them.
        - listitem [ref=f6e140]:
          - generic [ref=f6e141]: vii
          - generic [ref=f6e142]:
            - heading "Esperienza" [level=3] [ref=f6e143]
            - paragraph [ref=f6e144]: Experience
            - paragraph [ref=f6e145]: "His answer to the scholars who out-argued him: experience never deceives; only our judgements deceive us, by expecting of experience what it never promised."
          - generic [ref=f6e146]:
            - generic [ref=f6e147]: Therefore, on this page
            - paragraph [ref=f6e148]: Claims made here are demonstrated rather than asserted. The aerial screw turns so you can see why it cannot lift itself. The refectory is walkable so you can find the vanishing point yourself instead of being told where it is.
        - listitem [ref=f6e149]:
          - generic [ref=f6e150]: viii
          - generic [ref=f6e151]:
            - heading "Il foglio" [level=3] [ref=f6e152]
            - paragraph [ref=f6e153]: The sheet
            - paragraph [ref=f6e154]: He left roughly seven thousand notebook pages and almost no finished treatises. Geometry, shopping lists, riddles and anatomy share a single sheet.
          - generic [ref=f6e155]:
            - generic [ref=f6e156]: Therefore, on this page
            - paragraph [ref=f6e157]: This is a notebook, not a monograph. It is set as folios with marginalia in the gutter, it writes backwards where he wrote backwards, and it admits in the colophon what it has left unfinished.
