        - paragraph [ref=f6e379]: Inside the paintings
        - paragraph [ref=f6e380]: A painting in one-point perspective is a set of instructions for rebuilding a room. Here two of them are carried out. The refectory of the Last Supper is reconstructed from its own orthogonals and made walkable; the Mona Lisa is pulled apart into the depth planes it was assembled from. Both scenes stay asleep until you enter them.
