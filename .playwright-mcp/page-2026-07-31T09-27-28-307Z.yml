        - paragraph [ref=f6e181]: Roughly seven thousand pages survive, perhaps a quarter of what he made. They are not organised. Anatomy shares a sheet with a shopping list; a siege engine shares one with a riddle. Below they are sorted into the five preoccupations he kept returning to, which is a convenience he never granted himself.
